<!doctype html><meta charset="utf-8">
<body style="background:#111;color:#eee;font:13px monospace;margin:0">
<pre id="out">running</pre>
<iframe id="f" src="index.html" style="width:1920px;height:1080px;border:0"></iframe>
<script>
/* The layout checker from RESUME.md, pointed at the iframe's document instead
   of this one. Same logic: freeze the animations, walk every slide, report
   content spilling past the pad and text colliding with other text. */
setTimeout(function () {
  var d = document.getElementById('f').contentDocument;
  var st = d.createElement('style');
  st.textContent = '.slide [data-anim],.slide.is-active [data-anim]{opacity:1!important;' +
                   'animation:none!important;transform:none!important;clip-path:none!important}';
  d.head.appendChild(st);

  function leaves(r) {
    return [].slice.call(r.querySelectorAll('*')).filter(function (e) {
      if (!e.offsetParent) return false;
      if (e.querySelector('*')) return false;
      if (!e.textContent.trim()) return false;
      if (d.defaultView.getComputedStyle(e).display === 'inline') return false;
      var b = e.getBoundingClientRect();
      return b.width > 0 && b.height > 0;
    });
  }
  function hit(a, b) {
    return !(a.right <= b.left + 1 || b.right <= a.left + 1 ||
             a.bottom <= b.top + 1 || b.bottom <= a.top + 1);
  }

  var out = [], sl = [].slice.call(d.querySelectorAll('.slide'));
  sl.forEach(function (s, i) {
    sl.forEach(function (o, j) { o.classList.toggle('is-active', i === j); });
    var p = [], pad = s.querySelector('.pad');
    if (pad) { var o2 = pad.scrollHeight - pad.clientHeight; if (o2 > 2) p.push('pad+' + o2); }
    var e = leaves(s), r = e.map(function (x) { return x.getBoundingClientRect(); });
    for (var a = 0; a < e.length; a++)
      for (var b = a + 1; b < e.length; b++) {
        if (e[a].contains(e[b]) || e[b].contains(e[a])) continue;
        if (hit(r[a], r[b]))
          p.push('OVERLAP "' + e[a].textContent.trim().slice(0, 22) + '" x "' +
                                e[b].textContent.trim().slice(0, 22) + '"');
      }
    out.push('S' + (i + 1) + ': ' + (p.length ? p.slice(0, 3).join(' | ') : 'ok'));
  });
  st.remove();
  sl.forEach(function (o, j) { o.classList.toggle('is-active', j === 0); });
  document.getElementById('out').textContent = out.join('\n');
}, 3000);
</script>

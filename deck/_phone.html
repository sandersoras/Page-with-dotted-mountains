<!doctype html><meta charset="utf-8"><body style="margin:0;background:#000">
<iframe id="f" style="width:390px;height:844px;border:0;display:block"></iframe>
<script>
// The deck in a 390x844 iframe, which is the only reliable way to screenshot
// the portrait layout: headless Chrome given --window-size=390,844 renders at
// some other width and crops, which reads as content overflowing when it is
// not. The rotate prompt is dismissed on load, since the point here is to see
// what is behind it.
f.src = 'index.html' + (location.hash || '#s1');
f.onload = function () {
  setTimeout(function () {
    f.contentDocument.body.classList.add('rotate-dismissed');
  }, 200);
};
</script>
</body>
